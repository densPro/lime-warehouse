services:
  db:
    image: postgres:16
    command: ["postgres", "-p", "5436"]
    environment:
      POSTGRES_USER: lime
      POSTGRES_PASSWORD: lime
      POSTGRES_DB: lime_warehouse
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5436:5436"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5436 -U lime -d lime_warehouse"]
      interval: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8004:8004"

volumes:
  pgdata:
